# Production stack: API + PostgreSQL + Redis. Published to the internet via
# an existing Cloudflare Tunnel running on the host (systemd service,
# api.zelthr.asia -> localhost:8080), so no Caddy container or public ports
# are needed; the API port is bound to loopback only.
# Usage on the Ubuntu server (from the repo root):
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose --env-file .env.production -f deployments/docker-compose.prod.yml up -d --build
# Note: --env-file is required — the ${...} placeholders in this file are
# interpolated from it; env_file only injects variables into containers.
services:
  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://tyrako:${POSTGRES_PASSWORD}@db:5432/tyrako?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tyrako
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tyrako
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tyrako"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redisdata:/data
    networks:
      - backend

volumes:
  pgdata:
  redisdata:

networks:
  backend:
