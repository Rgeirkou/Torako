openapi: 3.0.3
info:
  title: Tyrako REST API
  description: Public REST API service built with Go.
  version: 0.5.1
servers:
  - url: https://your-domain.com
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    TwRedeemRequest:
      type: object
      required: [phone, gift]
      properties:
        phone:
          type: string
          description: Thai phone number, exactly 10 digits
          pattern: "^0[0-9]{9}$"
          example: "0812345678"
        gift:
          type: string
          description: Gift code (20-60 alphanumeric) or gift link
          example: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    TwRedeemResult:
      type: object
      description: Raw response received from the TrueMoney API, passed through unchanged
    Error:
      type: object
      properties:
        error: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    # Success responses are wrapped in a "data" envelope.
    ApiKeyResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ApiKey" }
    ApiKeyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }
    StatsResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Stats" }
    Stats:
      type: object
      required: [amount, count, errors, truemoney]
      properties:
        amount:
          type: number
          format: double
          description: Total amount in baht across all channels
        count:
          type: integer
          format: int64
          description: Total successful operations across all channels
        errors:
          type: integer
          format: int64
          description: Total failed attempts across all channels
        truemoney: { $ref: "#/components/schemas/StatsPart" }
    StatsPart:
      type: object
      required: [amount, count, errors]
      properties:
        amount:
          type: number
          format: double
        count:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
    TwRedeemResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/TwRedeemResult" }
    CreateApiKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          description: Human-readable name of the API key
          maxLength: 64
        rank:
          type: string
          enum: [member, partner, admin]
          default: member
          description: Rate limit tier. member 60 req/min, partner 1000 req/min, admin unlimited.
          example: partner
        scopes:
          type: array
          description: At least one scope is required (tw, admin)
          minItems: 1
          items:
            type: string
            enum: [tw, admin]
          example: [tw]
        expires_at:
          type: string
          format: date-time
          description: Optional expiry, must be in the future
    ApiKey:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        rank: { type: string, description: Rate limit tier (member, partner, admin) }
        key:
          type: string
          description: Plaintext key, only present in create/rotate responses
        scopes: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        request_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
paths:
  /keys:
    post:
      summary: Create an API key
      description: Requires the admin scope
      operationId: createApiKey
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: API key created (plaintext key returned once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      summary: List API keys
      description: Requires the admin scope
      operationId: listApiKeys
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /keys/{id}:
    delete:
      summary: Revoke an API key
      description: Requires the admin scope
      operationId: revokeApiKey
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: API key revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: API key not found }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /keys/{id}/rotate:
    post:
      summary: Rotate an API key
      description: Revokes the current key and issues a new one with the same name, rank, and scopes. Requires the admin scope.
      operationId: rotateApiKey
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: New API key (plaintext returned once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: API key not found }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /stats:
    get:
      summary: All-time success statistics
      description: Public endpoint, no API key required. Totals count successful redemptions.
      operationId: getStats
      responses:
        "200":
          description: Aggregate statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /tw:
    post:
      summary: Redeem a TrueMoney Wallet gift
      operationId: redeemTw
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwRedeemRequest" }
      responses:
        "200":
          description: Gift redemption accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwRedeemResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /tw/{phone}/{gift}:
    get:
      summary: Redeem a TrueMoney Wallet gift via path params
      operationId: redeemTwGet
      security:
        - ApiKeyAuth: []
      parameters:
        - name: phone
          in: path
          required: true
          schema: { type: string }
        - name: gift
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Gift redemption accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwRedeemResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
components:
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Input validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Upstream resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Upstream resource already consumed or conflicting state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: Upstream service unavailable or returned an invalid response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GatewayTimeout:
      description: Upstream service timed out
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: API key revoked, expired, or lacks the required scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded; retry after the Retry-After header
      headers:
        Retry-After:
          schema: { type: integer, format: int32 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
