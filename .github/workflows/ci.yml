name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify go.mod is tidy
        run: go mod tidy && git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -cover ./...

      - name: Build
        run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  integration:
    name: Integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tyrako
          POSTGRES_PASSWORD: tyrako
          POSTGRES_DB: tyrako
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tyrako"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://tyrako:tyrako@localhost:5432/tyrako?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -race -cover ./internal/repository/postgres/... ./internal/ratelimit/redislimit/...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deployments/Dockerfile -t tyrako:ci .
